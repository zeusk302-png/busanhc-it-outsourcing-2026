<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우주 보급품 모으기 게임</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0E14; /* 짙은 남색 배경 */
      color: #FFFFFF;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none; /* 터치 이동 시 스크롤 방지 */
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.2);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #0B0E14;
    }

    /* 상단 상태 표시줄 (HUD) */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(180deg, rgba(11,14,20,0.8) 0%, rgba(11,14,20,0) 100%);
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-text { color: #FFD166; } /* 노란색 */
    .hp-text { color: #FF4D6D; }    /* 빨간색 */
    .time-text { color: #00F5D4; }  /* 민트색 */

    /* 오버레이 화면 (시작 / 결과) */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 14, 20, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }

    .overlay h1 {
      font-size: 36px;
      margin-bottom: 15px;
      color: #00F5D4;
    }

    .overlay p {
      font-size: 18px;
      margin-bottom: 25px;
      line-height: 1.6;
      color: #E0E0E0;
    }

    .btn {
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      color: #0B0E14;
      background-color: #00F5D4;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:hover {
      background-color: #00D8BB;
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 게임 상단 정보 표시 -->
    <div id="hud">
      <div class="hud-item score-text">★ 점수: <span id="score-val">0</span></div>
      <div class="hud-item hp-text">♥ 체력: <span id="hp-val">3</span></div>
      <div class="hud-item time-text">⏱ 남은시간: <span id="time-val">30</span>s</div>
    </div>

    <!-- 캔버스 -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- 시작 오버레이 -->
    <div id="start-screen" class="overlay">
      <h1>우주 보급품 모으기</h1>
      <p>
        30초 동안 빨간 장애물을 피해<br>
        보급품(노란 별) 10개를 모으세요!<br><br>
        <strong>조작 방법:</strong> 키보드 방향키 / 마우스 클릭·드래그 / 터치
      </p>
      <button id="start-btn" class="btn">게임 시작</button>
    </div>

    <!-- 결과 오버레이 -->
    <div id="game-over-screen" class="overlay hidden">
      <h1 id="result-title">게임 종료</h1>
      <p id="result-desc">결과 메세지</p>
      <button id="restart-btn" class="btn">다시 하기</button>
    </div>
  </div>

  <script>
    // ==========================================
    // [수업용 핵심 설정값 - 학생들이 숫자를 변경하며 실습]
    // ==========================================
    const GAME_CONFIG = {
      // 1. 목표 및 제한
      TARGET_SCORE: 10,       /* [바꿀 숫자] 승리 목표 점수 */
      INITIAL_HP: 3,          /* [바꿀 숫자] 시작 체력 */
      TIME_LIMIT: 30,         /* [바꿀 숫자] 제한 시간 (초) */

      // 2. 우주선 및 이동 (★ 속도 단위: px/초)
      // 기존 60fps 감각을 유지하기 위해 프레임당 속도에 60을 곱함 (5px/frame * 60 = 300px/sec)
      PLAYER_SPEED: 300,      /* [바꿀 숫자] 우주선 이동 속도 (px/초) */
      PLAYER_RADIUS: 18,      /* [바꿀 숫자] 우주선 충돌 크기 (반지름 px) */

      // 3. 장애물 (★ 속도 단위: px/초)
      OBSTACLE_SPEED_MIN: 120, /* [바꿀 숫자] 장애물 최소 속도 (px/초) */
      OBSTACLE_SPEED_MAX: 240, /* [바꿀 숫자] 장애물 최대 속도 (px/초) */
      OBSTACLE_SPAWN_INTERVAL: 1.2, /* [바꿀 숫자] 장애물 생성 간격 (초 단위) */
      OBSTACLE_RADIUS: 15,    /* [바꿀 숫자] 장애물 충돌 크기 (반지름 px) */

      // 4. 보급품(별)
      STAR_RADIUS: 12          /* [바꿀 숫자] 별 크기 (반지름 px) */
    };

    // ==========================================
    // 게임 시스템 변수
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // DOM 요소
    const scoreValEl = document.getElementById('score-val');
    const hpValEl = document.getElementById('hp-val');
    const timeValEl = document.getElementById('time-val');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const resultTitle = document.getElementById('result-title');
    const resultDesc = document.getElementById('result-desc');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // 게임 상태 변수
    let score = 0;
    let hp = 0;
    let timeLeft = 0;
    let isPlaying = false;
    let animFrameId = null;       // requestAnimationFrame 취소용 ID
    let lastTime = 0;             // delta time 계산용 이전 프레임 타임스탬프
    let obstacleTimer = 0;        // 장애물 생성 주기 추적 타이머

    // 객체 상태
    let player = { x: 400, y: 300, targetX: 400, targetY: 300 };
    let star = { x: 0, y: 0 };
    let obstacles = [];

    // 입력 상태
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };
    let isPointerDown = false;

    // ==========================================
    // 이벤트 리스너 설정
    // ==========================================
    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });
    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    // 마우스 및 터치 포인터 입력
    function updatePointerPosition(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      player.targetX = (clientX - rect.left) * scaleX;
      player.targetY = (clientY - rect.top) * scaleY;
    }

    canvas.addEventListener('mousedown', (e) => {
      isPointerDown = true;
      updatePointerPosition(e);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (isPointerDown) updatePointerPosition(e);
    });
    window.addEventListener('mouseup', () => { isPointerDown = false; });

    canvas.addEventListener('touchstart', (e) => {
      isPointerDown = true;
      updatePointerPosition(e);
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (isPointerDown) updatePointerPosition(e);
    }, { passive: true });
    window.addEventListener('touchend', () => { isPointerDown = false; });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // ==========================================
    // 핵심 게임 로직
    // ==========================================

    // 기존 루프 취소 함수 (중복 실행 방지)
    function stopGameLoop() {
      if (animFrameId !== null) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
    }

    function startGame() {
      // 1. 기존 애니메이션 루프 취소
      stopGameLoop();

      // 2. 변수 초기화
      score = 0;
      hp = GAME_CONFIG.INITIAL_HP;
      timeLeft = GAME_CONFIG.TIME_LIMIT;
      isPlaying = true;
      obstacles = [];
      obstacleTimer = 0;
      lastTime = 0;

      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = player.x;
      player.targetY = player.y;

      spawnStar();
      updateHUD();

      // 3. 화면 UI 정리
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      // 4. 새 게임 루프 시작
      animFrameId = requestAnimationFrame(gameLoop);
    }

    function spawnStar() {
      const margin = 40;
      star.x = margin + Math.random() * (canvas.width - margin * 2);
      star.y = margin + Math.random() * (canvas.height - margin * 2);
    }

    function spawnObstacle() {
      const side = Math.floor(Math.random() * 4); // 0:상, 1:우, 2:하, 3:좌
      let x, y, vx, vy;
      const speed = GAME_CONFIG.OBSTACLE_SPEED_MIN + Math.random() * (GAME_CONFIG.OBSTACLE_SPEED_MAX - GAME_CONFIG.OBSTACLE_SPEED_MIN);

      if (side === 0) { // 위쪽 생성 -> 아래로 이동
        x = Math.random() * canvas.width;
        y = -20;
        vx = (Math.random() - 0.5) * speed;
        vy = speed;
      } else if (side === 1) { // 오른쪽 생성 -> 왼쪽으로 이동
        x = canvas.width + 20;
        y = Math.random() * canvas.height;
        vx = -speed;
        vy = (Math.random() - 0.5) * speed;
      } else if (side === 2) { // 아래쪽 생성 -> 위로 이동
        x = Math.random() * canvas.width;
        y = canvas.height + 20;
        vx = (Math.random() - 0.5) * speed;
        vy = -speed;
      } else { // 왼쪽 생성 -> 오른쪽으로 이동
        x = -20;
        y = Math.random() * canvas.height;
        vx = speed;
        vy = (Math.random() - 0.5) * speed;
      }

      obstacles.push({ x, y, vx, vy, radius: GAME_CONFIG.OBSTACLE_RADIUS });
    }

    function updateHUD() {
      scoreValEl.textContent = score;
      hpValEl.textContent = hp;
      timeValEl.textContent = Math.max(0, Math.ceil(timeLeft));
    }

    // ==========================================
    // 프레임 업데이트 및 렌더링 (deltaTime 활용)
    // ==========================================
    function update(dt) {
      if (!isPlaying) return;

      // 1. 제한 시간 차감
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        endGame(score >= GAME_CONFIG.TARGET_SCORE);
        return;
      }

      // 2. 우주선 위치 업데이트 (키보드 또는 포인터 이동)
      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp || keys.w) dy -= 1;
      if (keys.ArrowDown || keys.s) dy += 1;
      if (keys.ArrowLeft || keys.a) dx -= 1;
      if (keys.ArrowRight || keys.d) dx += 1;

      if (dx !== 0 || dy !== 0) {
        // 대각선 이동 시 속도 정규화
        const len = Math.hypot(dx, dy);
        player.x += (dx / len) * GAME_CONFIG.PLAYER_SPEED * dt;
        player.y += (dy / len) * GAME_CONFIG.PLAYER_SPEED * dt;
        player.targetX = player.x;
        player.targetY = player.y;
      } else if (isPointerDown) {
        // 포인터(마우스/터치) 클릭 또는 드래그 이동
        const pdx = player.targetX - player.x;
        const pdy = player.targetY - player.y;
        const dist = Math.hypot(pdx, pdy);
        const moveStep = GAME_CONFIG.PLAYER_SPEED * dt;

        if (dist > moveStep) {
          player.x += (pdx / dist) * moveStep;
          player.y += (pdy / dist) * moveStep;
        } else {
          player.x = player.targetX;
          player.y = player.targetY;
        }
      }

      // 화면 경계 제한
      player.x = Math.max(GAME_CONFIG.PLAYER_RADIUS, Math.min(canvas.width - GAME_CONFIG.PLAYER_RADIUS, player.x));
      player.y = Math.max(GAME_CONFIG.PLAYER_RADIUS, Math.min(canvas.height - GAME_CONFIG.PLAYER_RADIUS, player.y));

      // 3. 장애물 생성 및 이동
      obstacleTimer += dt;
      if (obstacleTimer >= GAME_CONFIG.OBSTACLE_SPAWN_INTERVAL) {
        spawnObstacle();
        obstacleTimer = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x += obs.vx * dt;
        obs.y += obs.vy * dt;

        // 화면 밖으로 멀리 나가면 제거
        if (obs.x < -50 || obs.x > canvas.width + 50 || obs.y < -50 || obs.y > canvas.height + 50) {
          obstacles.splice(i, 1);
          continue;
        }

        // 우주선과 장애물 충돌 검사
        const distToPlayer = Math.hypot(player.x - obs.x, player.y - obs.y);
        if (distToPlayer < GAME_CONFIG.PLAYER_RADIUS + obs.radius) {
          obstacles.splice(i, 1);
          hp -= 1;
          updateHUD();
          if (hp <= 0) {
            endGame(false);
            return;
          }
        }
      }

      // 4. 보급품(별) 획득 충돌 검사
      const distToStar = Math.hypot(player.x - star.x, player.y - star.y);
      if (distToStar < GAME_CONFIG.PLAYER_RADIUS + GAME_CONFIG.STAR_RADIUS) {
        score += 1;
        spawnStar();
        updateHUD();
      }

      updateHUD();
    }

    function render() {
      // 화면 초기화
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 별(보급품) 그리기
      ctx.save();
      ctx.fillStyle = '#FFD166';
      ctx.shadowColor = '#FFD166';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(star.x, star.y, GAME_CONFIG.STAR_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 2. 장애물 그리기
      ctx.save();
      ctx.fillStyle = '#FF4D6D';
      ctx.shadowColor = '#FF4D6D';
      ctx.shadowBlur = 8;
      for (const obs of obstacles) {
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 3. 우주선(민트색 삼각형) 그리기
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = '#00F5D4';
      ctx.shadowColor = '#00F5D4';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.moveTo(0, -GAME_CONFIG.PLAYER_RADIUS * 1.2);
      ctx.lineTo(-GAME_CONFIG.PLAYER_RADIUS, GAME_CONFIG.PLAYER_RADIUS);
      ctx.lineTo(GAME_CONFIG.PLAYER_RADIUS, GAME_CONFIG.PLAYER_RADIUS);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 메인 게임 루프 (timestamp 및 deltaTime 적용)
    function gameLoop(timestamp) {
      if (!isPlaying) return;

      if (!lastTime) lastTime = timestamp;
      let dt = (timestamp - lastTime) / 1000; // 밀리초(ms)를 초(sec) 단위를 변환
      lastTime = timestamp;

      // 비정상적으로 큰 dt 방지 (예: 탭 전환 후 돌아올 때 급격한 위치 이동 방지)
      if (dt > 0.1) dt = 0.1;

      update(dt);
      render();

      if (isPlaying) {
        animFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function endGame(isSuccess) {
      isPlaying = false;
      stopGameLoop(); // 루프 종료시 애니메이션 프레임 취소

      if (isSuccess) {
        resultTitle.textContent = "MISSION SUCCESS!";
        resultTitle.style.color = "#00F5D4";
        resultDesc.innerHTML = `축하합니다! 보급품을 무사히 모았습니다.<br>최종 점수: <strong>${score}점</strong>`;
      } else {
        resultTitle.textContent = "MISSION FAILED";
        resultTitle.style.color = "#FF4D6D";
        resultDesc.innerHTML = `${hp <= 0 ? "체력이 모두 소진되었습니다." : "제한 시간이 초과되었습니다."}<br>최종 점수: <strong>${score}점</strong>`;
      }

      gameOverScreen.classList.remove('hidden');
    }
  </script>
</body>
</html>
