<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 굿즈 견적 계산기 · 가상 교육용 의뢰</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#17253a;font:18px/1.6 system-ui,sans-serif}main{max-width:760px;margin:40px auto;padding:28px;background:white;border-radius:20px}h1{line-height:1.3}label{display:block;margin-top:18px;font-weight:700}input,select,button{font:inherit;width:100%;padding:12px;border:1px solid #9aaac0;border-radius:8px}button{margin-top:24px;background:#2246a5;color:white;border:0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e67c16;outline-offset:3px}.note{color:#465672;font-size:15px}#result{background:#f2f6ff;padding:18px;border-radius:10px;margin-top:24px}#error{color:#a11b1b;font-weight:bold}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #d4ddeb;padding:8px 0}.total{font-size:24px;font-weight:bold}@media(max-width:600px){main{margin:12px;padding:20px}body{font-size:16px}}
</style></head><body><main>
<p class="note">가상 교육용 의뢰 · 실제 주문이나 결제를 받지 않습니다.</p>
<h1>내 굿즈, 얼마에 만들까?</h1>
<p>상품과 인쇄 옵션을 고르고 수량을 넣으면 견적을 확인할 수 있습니다.</p>
<form id="quote-form" novalidate>
<label for="product">상품</label><select id="product"><option value="badge">배지 · 개당 1,500원</option><option value="keyring">키링 · 개당 2,500원</option></select>
<label for="printing">인쇄 옵션</label><select id="printing"><option value="plain">기본 · 추가 0원</option><option value="color">컬러 · 개당 추가 500원</option></select>
<label for="quantity">수량 · 1~100개 정수</label><input id="quantity" type="number" min="1" max="100" step="1" value="4" inputmode="numeric" aria-describedby="shipping-rule error">
<p id="shipping-rule" class="note">상품 금액이 20,000원 이상이면 배송비 0원, 미만이면 3,000원입니다.</p>
<button type="submit">견적 계산하기</button></form>
<p id="error" role="alert"></p><section id="result" aria-live="polite" aria-label="계산 결과"><p>옵션을 선택한 뒤 계산 버튼을 누르세요.</p></section>
<script>
"use strict";
const PRODUCT_PRICES = {badge: 1500, keyring: 2500};
const PRINTING_PRICES = {plain: 0, color: 500};
function calculateQuote(product, printing, quantityText) {
  if (!Object.prototype.hasOwnProperty.call(PRODUCT_PRICES, product) || !Object.prototype.hasOwnProperty.call(PRINTING_PRICES, printing)) {
    throw new Error("목록에서 상품과 인쇄 옵션을 선택하세요.");
  }
  if (typeof quantityText !== "string" || !/^\d+$/.test(quantityText.trim())) {
    throw new Error("수량은 1~100 사이의 정수로 입력하세요.");
  }
  const quantity = Number(quantityText.trim());
  if (!Number.isSafeInteger(quantity) || quantity < 1 || quantity > 100) {
    throw new Error("수량은 1~100 사이의 정수로 입력하세요.");
  }
  // TODO 1: 옵션 포함 단가와 상품 금액을 계산하세요.
  // TODO 2: 배송비 경계 20000원을 처리하세요.
  // TODO 3: quantity, unitPrice, subtotal, shipping, total을 반환하세요.
  throw new Error("계산 로직 TODO를 채워 주세요. 입력 검사와 화면 틀은 준비되어 있습니다.");
}
function bindQuoteForm(doc) {
  const form = doc.getElementById("quote-form");
  form.addEventListener("submit", function(event) {
    event.preventDefault();
    const result = doc.getElementById("result");
    const error = doc.getElementById("error");
    error.textContent = "";
    result.replaceChildren();
    try {
      const quote = calculateQuote(doc.getElementById("product").value, doc.getElementById("printing").value, doc.getElementById("quantity").value);
      const rows = [["수량", quote.quantity + "개"], ["옵션 포함 단가", quote.unitPrice.toLocaleString("ko-KR") + "원"], ["상품 금액", quote.subtotal.toLocaleString("ko-KR") + "원"], ["배송비", quote.shipping.toLocaleString("ko-KR") + "원"], ["총 견적", quote.total.toLocaleString("ko-KR") + "원"]];
      for (const row of rows) {
        const line = doc.createElement("div"); line.className = "row";
        if (row[0] === "총 견적") line.className += " total";
        const label = doc.createElement("span"); label.textContent = row[0];
        const value = doc.createElement("span"); value.textContent = row[1];
        line.append(label, value); result.append(line);
      }
    } catch (problem) {
      error.textContent = problem.message;
      const note = doc.createElement("p"); note.textContent = "입력을 고친 뒤 다시 계산하세요. 이전 견적은 지웠습니다."; result.append(note);
    }
  });
}
if (typeof document !== "undefined") bindQuoteForm(document);
</script></main></body></html>
